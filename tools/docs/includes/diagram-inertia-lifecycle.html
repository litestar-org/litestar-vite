<div class="lv-diag lv-diag--inertia-lifecycle">
  <style>
    .lv-diag--inertia-lifecycle {
      --lv-surface: var(--md-default-bg-color, #ffffff);
      --lv-card: var(--md-code-bg-color, #f8fafc);
      --lv-border: rgba(148, 163, 184, 0.35);
      --lv-text: var(--md-default-fg-color, #0f172a);
      --lv-muted: var(--md-default-fg-color--light, #475569);
      --lv-blue: #2563eb;
      --lv-amber: #d97706;
      --lv-emerald: #059669;
      --lv-violet: #7c3aed;
      margin: 1.5rem 0;
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--lv-border);
      background: var(--lv-surface);
    }
    [data-md-color-scheme="slate"] .lv-diag--inertia-lifecycle {
      --lv-card: rgba(30, 41, 59, 0.85);
      --lv-border: rgba(148, 163, 184, 0.24);
      --lv-blue: #60a5fa;
      --lv-amber: #fbbf24;
      --lv-emerald: #34d399;
      --lv-violet: #a78bfa;
    }
    .lv-diag--inertia-lifecycle svg {
      width: 100%;
      height: auto;
      display: block;
      font-family: var(--md-text-font-family, system-ui, -apple-system, sans-serif);
    }
    .lv-diag--inertia-lifecycle .lv-req-line {
      stroke-dasharray: 8 6;
      animation: lv-inertia-dash 1.7s linear infinite;
    }
    .lv-diag--inertia-lifecycle .lv-res-line {
      stroke-dasharray: 8 6;
      animation: lv-inertia-dash-rev 1.7s linear infinite;
    }
    @keyframes lv-inertia-dash {
      to { stroke-dashoffset: -28; }
    }
    @keyframes lv-inertia-dash-rev {
      to { stroke-dashoffset: 28; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lv-diag--inertia-lifecycle .lv-req-line,
      .lv-diag--inertia-lifecycle .lv-res-line {
        animation: none !important;
      }
    }
  </style>
  <svg viewBox="0 0 920 390" role="img" aria-labelledby="lv-inertia-title lv-inertia-desc">
    <title id="lv-inertia-title">Inertia v2 Request, Prop Evaluation, and Partial Reload Lifecycle</title>
    <desc id="lv-inertia-desc">Illustrates four phases of the Inertia v2 protocol between Browser and Litestar: 1. Initial Full-Page Visit (HTML + SSR), 2. Client X-Inertia Navigation (PageProps JSON), 3. Deferred and Partial Reloads (X-Inertia-Partial-Data with defer() and merge()), and 4. Redirects and Asset Version Mismatch (303 See Other and 409 Conflict).</desc>

    <!-- Swimlane Headers -->
    <rect x="30" y="18" width="210" height="44" rx="8" fill="var(--lv-card)" stroke="var(--lv-blue)" stroke-width="2" />
    <text x="135" y="45" text-anchor="middle" fill="var(--lv-text)" font-size="14" font-weight="700">Inertia v2 Client Router</text>

    <rect x="650" y="18" width="240" height="44" rx="8" fill="var(--lv-card)" stroke="var(--lv-amber)" stroke-width="2" />
    <text x="770" y="45" text-anchor="middle" fill="var(--lv-text)" font-size="14" font-weight="700">Litestar InertiaPlugin + Response</text>

    <line x1="135" y1="62" x2="135" y2="370" stroke="var(--lv-border)" stroke-width="2" />
    <line x1="770" y1="62" x2="770" y2="370" stroke="var(--lv-border)" stroke-width="2" />

    <!-- Phase 1: Initial Visit -->
    <text x="450" y="86" text-anchor="middle" fill="var(--lv-text)" font-size="12" font-weight="700">Initial Visit — GET /books</text>
    <line class="lv-req-line" x1="145" y1="96" x2="760" y2="96" stroke="var(--lv-blue)" stroke-width="2.2" />
    <line class="lv-res-line" x1="145" y1="120" x2="760" y2="120" stroke="var(--lv-emerald)" stroke-width="2.2" />
    <text x="450" y="114" text-anchor="middle" fill="var(--lv-emerald)" font-size="11" font-family="monospace">200 OK text/html • SSR markup + PageProps JSON</text>

    <!-- Phase 2: Client Navigation -->
    <text x="450" y="162" text-anchor="middle" fill="var(--lv-text)" font-size="12" font-weight="700">Client Visit — GET /books/42 (X-Inertia: true)</text>
    <line class="lv-req-line" x1="145" y1="172" x2="760" y2="172" stroke="var(--lv-blue)" stroke-width="2.2" />
    <line class="lv-res-line" x1="145" y1="196" x2="760" y2="196" stroke="var(--lv-violet)" stroke-width="2.2" />
    <text x="450" y="190" text-anchor="middle" fill="var(--lv-violet)" font-size="11" font-family="monospace">200 OK application/json • PageProps envelope</text>

    <!-- Phase 3: Deferred & Partial Reloads -->
    <text x="450" y="238" text-anchor="middle" fill="var(--lv-text)" font-size="12" font-weight="700">Partial Reload — X-Inertia-Partial-Data</text>
    <line class="lv-req-line" x1="145" y1="248" x2="760" y2="248" stroke="var(--lv-amber)" stroke-width="2.2" />
    <line class="lv-res-line" x1="145" y1="272" x2="760" y2="272" stroke="var(--lv-emerald)" stroke-width="2.2" />
    <text x="450" y="266" text-anchor="middle" fill="var(--lv-emerald)" font-size="11" font-family="monospace">Evaluates requested defer() / lazy() props + mergeProps</text>

    <!-- Phase 4: Mutations & Version Rotation -->
    <text x="450" y="314" text-anchor="middle" fill="var(--lv-text)" font-size="12" font-weight="700">Mutations &amp; Asset Version Rotation</text>
    <line class="lv-req-line" x1="145" y1="324" x2="760" y2="324" stroke="var(--lv-blue)" stroke-width="2.2" />
    <line class="lv-res-line" x1="145" y1="348" x2="760" y2="348" stroke="var(--lv-amber)" stroke-width="2.2" />
    <text x="450" y="342" text-anchor="middle" fill="var(--lv-amber)" font-size="11" font-family="monospace">303 See Other redirect • 409 Conflict on version change</text>
  </svg>
</div>
