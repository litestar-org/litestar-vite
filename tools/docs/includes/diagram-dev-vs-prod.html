<div class="lv-diag lv-diag--dev-vs-prod">
  <style>
    .lv-diag--dev-vs-prod {
      --lv-surface: var(--md-default-bg-color, #ffffff);
      --lv-card: var(--md-code-bg-color, #f8fafc);
      --lv-border: rgba(148, 163, 184, 0.35);
      --lv-text: var(--md-default-fg-color, #0f172a);
      --lv-muted: var(--md-default-fg-color--light, #475569);
      --lv-blue: #2563eb;
      --lv-amber: #d97706;
      --lv-emerald: #059669;
      margin: 1.5rem 0;
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--lv-border);
      background: var(--lv-surface);
    }
    [data-md-color-scheme="slate"] .lv-diag--dev-vs-prod {
      --lv-card: rgba(30, 41, 59, 0.85);
      --lv-border: rgba(148, 163, 184, 0.24);
      --lv-blue: #60a5fa;
      --lv-amber: #fbbf24;
      --lv-emerald: #34d399;
    }
    .lv-diag--dev-vs-prod svg {
      width: 100%;
      height: auto;
      display: block;
      font-family: var(--md-text-font-family, system-ui, -apple-system, sans-serif);
    }
    .lv-diag--dev-vs-prod .lv-stream-dev {
      stroke-dasharray: 7 5;
      animation: lv-dvp-flow 1.6s linear infinite;
    }
    .lv-diag--dev-vs-prod .lv-stream-prod {
      stroke-dasharray: 9 5;
      animation: lv-dvp-flow 2.2s linear infinite;
    }
    @keyframes lv-dvp-flow {
      to { stroke-dashoffset: -28; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lv-diag--dev-vs-prod .lv-stream-dev,
      .lv-diag--dev-vs-prod .lv-stream-prod {
        animation: none !important;
      }
    }
  </style>
  <svg viewBox="0 0 920 350" role="img" aria-labelledby="lv-dvp-title lv-dvp-desc">
    <title id="lv-dvp-title">Development Mode vs. Production Mode Asset and SSR Execution</title>
    <desc id="lv-dvp-desc">Side-by-side comparison of Development Mode (hot file discovery, ViteProxyMiddleware streaming, unbundled ESM + HMR) and Production Mode (manifest.json resolution via ViteAssetLoader, Granian StaticPlacement.NATIVE immutable caching, and persistent StdioIPCTransport SSR worker).</desc>

    <!-- Left Column: Development Mode -->
    <rect x="20" y="20" width="425" height="310" rx="14" fill="var(--lv-card)" stroke="var(--lv-blue)" stroke-width="2" />
    <text x="232" y="50" text-anchor="middle" fill="var(--lv-text)" font-size="15" font-weight="700">Development Mode (dev_mode=True)</text>
    <text x="232" y="70" text-anchor="middle" fill="var(--lv-blue)" font-size="11" font-family="monospace">Hot-file discovery • Live Vite ESM &amp; HMR</text>

    <rect x="45" y="90" width="375" height="58" rx="8" fill="var(--lv-surface)" stroke="var(--lv-border)" />
    <text x="232" y="114" text-anchor="middle" fill="var(--lv-text)" font-size="13" font-weight="600">ViteAssetLoader (Hot-File Mode)</text>
    <text x="232" y="134" text-anchor="middle" fill="var(--lv-muted)" font-size="11" font-family="monospace">Reads public/hot → injects @vite/client</text>

    <line class="lv-stream-dev" x1="232" y1="148" x2="232" y2="172" stroke="var(--lv-blue)" stroke-width="2.5" />

    <rect x="45" y="172" width="375" height="62" rx="8" fill="var(--lv-surface)" stroke="var(--lv-blue)" />
    <text x="232" y="196" text-anchor="middle" fill="var(--lv-text)" font-size="13" font-weight="600">ViteProxyMiddleware (Single-Port :8000)</text>
    <text x="232" y="216" text-anchor="middle" fill="var(--lv-muted)" font-size="11" font-family="monospace">Streams assets &amp; /vite-hmr to Vite (:5173)</text>

    <line class="lv-stream-dev" x1="232" y1="234" x2="232" y2="256" stroke="var(--lv-blue)" stroke-width="2.5" />

    <rect x="45" y="256" width="375" height="56" rx="8" fill="var(--lv-surface)" stroke="var(--lv-border)" />
    <text x="232" y="280" text-anchor="middle" fill="var(--lv-text)" font-size="13" font-weight="600">Dev SSR &amp; Fragments (TCPStreamIPCTransport)</text>
    <text x="232" y="298" text-anchor="middle" fill="var(--lv-muted)" font-size="11" font-family="monospace">POST /__litestar_ssr__ → Vite ServerModuleRunner</text>

    <!-- Right Column: Production Mode -->
    <rect x="475" y="20" width="425" height="310" rx="14" fill="var(--lv-card)" stroke="var(--lv-emerald)" stroke-width="2" />
    <text x="687" y="50" text-anchor="middle" fill="var(--lv-text)" font-size="15" font-weight="700">Production Mode (dev_mode=False)</text>
    <text x="687" y="70" text-anchor="middle" fill="var(--lv-emerald)" font-size="11" font-family="monospace">Zero Dev Server • Immutable Hashed Bundles</text>

    <rect x="500" y="90" width="375" height="58" rx="8" fill="var(--lv-surface)" stroke="var(--lv-border)" />
    <text x="687" y="114" text-anchor="middle" fill="var(--lv-text)" font-size="13" font-weight="600">ViteAssetLoader (Manifest Mode)</text>
    <text x="687" y="134" text-anchor="middle" fill="var(--lv-muted)" font-size="11" font-family="monospace">Parses manifest.json → hashed CSS/JS tags</text>

    <line class="lv-stream-prod" x1="687" y1="148" x2="687" y2="172" stroke="var(--lv-emerald)" stroke-width="2.5" />

    <rect x="500" y="172" width="375" height="62" rx="8" fill="var(--lv-surface)" stroke="var(--lv-emerald)" />
    <text x="687" y="196" text-anchor="middle" fill="var(--lv-text)" font-size="13" font-weight="600">Static Serving (StaticPlacement.NATIVE)</text>
    <text x="687" y="216" text-anchor="middle" fill="var(--lv-muted)" font-size="11" font-family="monospace">Immutable caching + metadata blocking</text>

    <line class="lv-stream-prod" x1="687" y1="234" x2="687" y2="256" stroke="var(--lv-emerald)" stroke-width="2.5" />

    <rect x="500" y="256" width="375" height="56" rx="8" fill="var(--lv-surface)" stroke="var(--lv-border)" />
    <text x="687" y="280" text-anchor="middle" fill="var(--lv-text)" font-size="13" font-weight="600">Prod SSR Worker (StdioIPCTransport)</text>
    <text x="687" y="298" text-anchor="middle" fill="var(--lv-muted)" font-size="11" font-family="monospace">NDJSON stdin/stdout pool + SSRCircuitBreaker</text>
  </svg>
</div>
