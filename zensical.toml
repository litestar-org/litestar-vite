  ] },
  { "Architecture" = [
    { "System Overview" = "architecture/index.md" },
    { "Single-Port Dev Proxy & Bridge" = "architecture/dev-proxy-and-bridge.md" },
    { "SSR & Fragment IPC Transports" = "architecture/ssr-and-ipc.md" },
    { "Codegen & Artifact Determinism" = "architecture/codegen-pipeline.md" },
  ] },
  { "Reference" = [
    { "Overview" = "reference/index.md" },
    { "Plugin & Configuration" = "reference/plugin-and-config.md" },
    { "Inertia API" = "reference/inertia.md" },
    { "Fragments & IPC" = "reference/fragments-and-ipc.md" },
    { "Runtime, Assets & Executors" = "reference/runtime-and-assets.md" },
    { "Tooling, Doctor, Deploy & Codegen" = "reference/tooling-and-codegen.md" },
    { "CLI Reference (litestar assets)" = "reference/cli.md" },
    { "Bridge & Wire Contracts" = "reference/contracts.md" },
    { "TypeScript API" = [
      { "Subpaths & Vite Plugin" = "reference/typescript/index.md" },
      { "Runtime & Inertia Helpers" = "reference/typescript/helpers.md" },
