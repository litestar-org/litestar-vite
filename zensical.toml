[project]
site_name = "Litestar Vite"
site_description = "Connect Litestar ASGI applications with Vite 7+, Inertia.js v2, cross-platform SSR, island fragments, and end-to-end OpenAPI + AsyncAPI type generation."
site_url = "https://litestar-org.github.io/litestar-vite/"
repo_url = "https://github.com/litestar-org/litestar-vite"
repo_name = "litestar-org/litestar-vite"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
exclude_docs = """
examples/**
_tapes/**
"""
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/termynal.js"]
nav = [
  { "Home" = [
    { "Overview" = "index.md" },
  ] },
  { "Getting Started" = [
    { "Installation & Setup" = "getting-started/index.md" },
    { "Quick Start: SPA Mode" = "getting-started/quick-start-spa.md" },
    { "Quick Start: Inertia v2" = "getting-started/quick-start-inertia.md" },
    { "Quick Start: Jinja & Islands" = "getting-started/quick-start-templates.md" },
  ] },
  { "Core Concepts" = [
    { "How Litestar & Vite Work Together" = "learn/index.md" },
    { "Operating Modes" = "learn/operating-modes.md" },
    { "Configuration Guide" = "learn/configuration.md" },
    { "Dev Server & Single-Port Proxy" = "learn/development-and-proxy.md" },
    { "Static Props" = "learn/static-props.md" },
    { "Islands & HTMX" = "learn/islands-and-htmx.md" },
    { "Server-Side Rendering (SSR)" = "learn/ssr.md" },
    { "Production & Deployment" = "learn/production-and-deploy.md" },
    { "Doctor & Troubleshooting" = "learn/doctor-and-troubleshooting.md" },
    { "Migrating to v0.33" = "learn/migration-0-33.md" },
    { "Migrating to v0.32" = "learn/migration-0-32.md" },
  ] },
  { "Frameworks & Inertia" = [
    { "Framework Matrix" = "frameworks/index.md" },
    { "Inertia.js" = [
      { "Overview & Lifecycle" = "frameworks/inertia/index.md" },
      { "Configuration & Templates" = "frameworks/inertia/configuration-and-templates.md" },
      { "Pages & Responses" = "frameworks/inertia/pages-and-responses.md" },
      { "Routing, Links & Redirects" = "frameworks/inertia/routing-and-links.md" },
      { "Forms, Validation & Precognition" = "frameworks/inertia/forms-and-validation.md" },
      { "File Uploads" = "frameworks/inertia/file-uploads.md" },
      { "Shared Data & Flash Messages" = "frameworks/inertia/shared-data-and-flash.md" },
      { "Partial Reloads & Deferred Props" = "frameworks/inertia/partial-reloads-and-deferred.md" },
      { "Merging Props & Infinite Scroll" = "frameworks/inertia/merging-and-infinite-scroll.md" },
      { "Polling, Prefetching & Remembering" = "frameworks/inertia/client-visits.md" },
      { "Security, History & Versioning" = "frameworks/inertia/security-and-versioning.md" },
      { "SSR, TypeScript & Upgrade Guide" = "frameworks/inertia/ssr-and-typescript.md" },
    ] },
    { "UI Libraries & HTMX" = [
      { "React" = "frameworks/react.md" },
      { "Vue 3" = "frameworks/vue.md" },
      { "Svelte 5" = "frameworks/svelte.md" },
      { "Angular" = "frameworks/angular.md" },
      { "HTMX" = "frameworks/htmx.md" },
    ] },
    { "Meta-Frameworks" = [
      { "Astro" = "frameworks/astro.md" },
      { "Nuxt" = "frameworks/nuxt.md" },
      { "SvelteKit" = "frameworks/sveltekit.md" },
    ] },
  ] },
  { "TypeGen & Realtime" = [
    { "Type Generation Pipeline" = "typegen/index.md" },
    { "OpenAPI TypeScript SDK" = "typegen/openapi-sdk.md" },
